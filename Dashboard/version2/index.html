<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Duckiebot Dashboard</title>
  <script src="roslib.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    html, body {
      height: 100%;
      background: white;
      background-attachment: fixed;
      background-repeat: no-repeat;
      background-size: cover;
    }

    body { color: white; }

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: 
       linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
       url("https://duckietown.com/wp-content/uploads/2020/10/db21-mooc-a.jpg") center/cover no-repeat;
      }

.login-container {
  width: 900px;
  height: 550px;
  display: flex;
  border-radius: 12px;
  overflow: hidden;
  background: white;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}

/* LEFT SIDE */
.login-left {
  flex: 1;
  background: url("https://duckietown.com/wp-content/uploads/2020/10/db21-mooc-a.jpg") center/cover no-repeat;
  position: relative;
}

.login-left .overlay {
  position: absolute;
  bottom: 40px;
  left: 30px;
  right: 30px;
  color: white;
}

.login-left h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

.login-left p {
  font-size: 14px;
  opacity: 0.9;
}

/* RIGHT SIDE */
.login-right {
  flex: 1;
  padding: 50px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.login-right h2 {
  margin-bottom: 10px;
  color: #2c3e50;
}

.subtitle {
  font-size: 13px;
  color: #777;
  margin-bottom: 25px;
}

.login-right input {
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.login-right button {
  padding: 12px;
  border: none;
  background: #2c2c2c;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.login-right button:hover {
  background: #000;
}
/* HEADER */
.main-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 40px;
  background: white;
  color: #222;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo img {
  width: 40px;
  height: 40px;
  border-radius: 10px;
}

.logo span {
  font-weight: bold;
  font-size: 18px;
}

.nav span {
  margin: 0 15px;
  font-size: 14px;
  cursor: pointer;
  color: #555;
}

.nav span:hover {
  color: black;
}

.logout-btn {
  background: black;
  color: white;
  border-radius: 20px;
  padding: 8px 16px;
}

.hero {
  margin: 30px 40px;
  height: 220px;
  background: 
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
    url("https://duckietown.com/wp-content/uploads/2020/10/db21-mooc-a.jpg") center/cover;
  display: flex;
  align-items: center;
  padding: 30px;
  color: white;
}

.hero h1 {
  font-size: 32px;
}

.hero p {
  opacity: 0.9;
  margin-top: 10px;
}

.dashboard {
  display: grid;
  grid-template-columns: 2fr 2fr;
  gap: 25px;
  padding: 0 40px 40px;
}

.card {
  background: white;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.card h2 {
  margin-bottom: 15px;
  color: #222;
}

.card img {
  width: 100%;
}

.pose {
  grid-column: span 2;
}

body {
  background: #f5f7fb;
}
  </style>
</head>

<body>

  <div id="loginScreen">
  <div class="login-container">

    <div class="login-left">
      <div class="overlay">
      </div>
    </div>

    <div class="login-right">
      <h2>Welcome Back!</h2>
      <p class="subtitle">Sign in your account</p>

      <input id="username" placeholder="Your Name">
      <input id="password" type="password" placeholder="Password">

      <button onclick="login()">Login</button>

      <p id="error"></p>
    </div>

  </div>
</div>
  <div id="app">

  <header class="main-header">
    <div class="logo">
      <img src="https://duckietown.com/wp-content/uploads/2020/10/db21-mooc-a.jpg">
      <span>Duckie Dashboard</span>
    </div>

    <div class="nav">
      <span>Overview</span>
      <span>Camera</span>
      <span>Analytics</span>
      <span>Status</span>
    </div>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="hero">
    <div class="hero-text">
      <h1>Smart Robot Monitoring</h1>
    </div>
  </div>

  <div class="dashboard">

    <div class="card camera">
      <h2>Camera Feed</h2>
      <img id="duckiecam" />
    </div>

    <div class="card viz">
      <h2>Live Visualization</h2>
      <img id="vizimg" />
    </div>

    <div class="card pose">
      <h2>Fused Pose</h2>
      <pre id="pose"></pre>
    </div>

  </div>

</div>

  <script>

  function login() {
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;

    if (u === USER && p === PASS) {
      localStorage.setItem("auth", "true");
      showApp();
    } else {
      document.getElementById("error").innerText = "Wrong credentials";
    }
  }

  function logout() {
    localStorage.removeItem("auth");
    location.reload();
  }

  function showApp() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  window.onload = function() {
    if (localStorage.getItem("auth") === "true") {
      showApp();
    }
  }

  var ros = new ROSLIB.Ros({ url : 'ws://172.17.8.100:9001' });

  ros.on('connection', () => console.log('Connected'));
  ros.on('error', (e) => console.error(e));
  ros.on('close', () => console.log('Closed'));

  // Visualization topic (compressed image)
  var vizTopic = new ROSLIB.Topic({
    ros : ros,
    name : '/bird/live_visualization/compressed',
    messageType : 'sensor_msgs/CompressedImage'
  });

  vizTopic.subscribe(function(message) {
    const img = new Image();
    img.src = "data:image/jpeg;base64," + message.data;

    img.onload = function() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const halfWidth = Math.floor(2.85*img.width / 5);

      // Left half → Camera Feed
      const leftCanvas = document.createElement('canvas');
      leftCanvas.width = halfWidth;
      leftCanvas.height = img.height;
      leftCanvas.getContext('2d').drawImage(
        canvas, 0, 0, halfWidth, img.height,
        0, 0, halfWidth, img.height
      );
      document.getElementById('duckiecam').src = leftCanvas.toDataURL('image/jpeg');

      // Right half → Visualization
      const rightCanvas = document.createElement('canvas');
      rightCanvas.width = halfWidth;
      rightCanvas.height = img.height;
      rightCanvas.getContext('2d').drawImage(
        canvas, halfWidth, 0, halfWidth, img.height,
        0, 0, halfWidth, img.height
      );
      document.getElementById('vizimg').src = rightCanvas.toDataURL('image/jpeg');
    };
  });

  // Fused pose listener remains unchanged
  var fusedPoseListener = new ROSLIB.Topic({
    ros : ros,
    name : '/robot/pose',
    messageType : 'geometry_msgs/PoseStamped'
  });

  fusedPoseListener.subscribe(function(msg) {
    document.getElementById('pose').textContent =
      JSON.stringify(msg, null, 2);
  });
</script>

</body>
</html>
